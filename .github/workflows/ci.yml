name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from "packageManager" in package.json and caches its store.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit and integration tests against an embedded PostgreSQL 18 (no service container needed).
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Real API and worker processes: LAN operation, Internet outage, power loss, Telegram bot.
      - run: pnpm test:e2e

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The three images share the build stage: the api step caches it (mode=max), the other two
      # reuse it and cache only their own final layers.
      - name: api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          tags: pcos/api:ci
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          tags: pcos/worker:ci
          push: false
          cache-from: |
            type=gha,scope=api
            type=gha,scope=worker
          cache-to: type=gha,scope=worker
      - name: web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          tags: pcos/web:ci
          push: false
          cache-from: |
            type=gha,scope=api
            type=gha,scope=web
          cache-to: type=gha,scope=web
