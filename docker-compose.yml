# Venue Edge Server — the whole local stack.
#   cp .env.example .env   # fill in SESSION_SECRET, POSTGRES_PASSWORD, hostnames
#   docker compose up -d
#
# Only the reverse proxy is published on the venue network (80/443).
# PostgreSQL, Redis, the API and the web server are reachable only on the
# internal Docker network (spec §11, §104).

name: pcos

x-app: &app
  restart: unless-stopped
  env_file: .env
  networks: [edge]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pcos}
      # Always UTF-8, independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [edge]
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Cache / rate limits / presence only — nothing authoritative lives in Redis.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    build: { context: ., target: api }
    image: pcos/api:${PCOS_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pcos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pcos}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: loopback,172.28.0.0/24
      STORAGE_DIR: /data/files
      BACKUP_DIR: /data/backups
    volumes:
      - edgedata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 20s

  worker:
    <<: *app
    build: { context: ., target: worker }
    image: pcos/worker:${PCOS_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pcos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pcos}
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/files
      BACKUP_DIR: /data/backups
      PG_DUMP_PATH: /usr/bin/pg_dump
    volumes:
      - edgedata:/data
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    stop_grace_period: 20s

  web:
    <<: *app
    build:
      context: .
      target: web
      args: { API_ORIGIN: "http://api:4000" }
    image: pcos/web:${PCOS_VERSION:-latest}
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${LOCAL_HOSTNAME:-poker.local}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.10
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  # Optional S3-compatible object storage on the edge: docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pcos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-please}
    volumes:
      - minio:/data
    networks: [edge]

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  edgedata:
  caddy_data:
  caddy_config:
  minio:
